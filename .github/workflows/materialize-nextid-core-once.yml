name: Materialize reviewed Keycloak source once

on:
  push:
    branches:
      - core/materialize-nextid-keycloak-26.8.2
    paths:
      - .github/workflows/materialize-nextid-core-once.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the import branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          submodules: false
      - name: Import immutable upstream tree without executing source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = core/materialize-nextid-keycloak-26.8.2
          git fetch --depth=1 --no-tags https://github.com/keycloak/keycloak.git refs/tags/26.8.2
          test "$(git rev-parse FETCH_HEAD)" = "e514445f9dcdabc5bdcf67cab56c1e49655de067"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "6f439a9bda71c39bf725150cea5d50f149e423f6"
          git update-index --force-remove Core/NextID-Core/source
          git read-tree --prefix=Core/NextID-Core/source/ "6f439a9bda71c39bf725150cea5d50f149e423f6"
          git rm --cached -- .gitmodules .github/workflows/materialize-nextid-core-once.yml
          test "$(git write-tree)" != ""
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Vendor exact Keycloak 26.8.2 source tree under Core"
          test "$(git rev-parse HEAD:Core/NextID-Core/source)" = "6f439a9bda71c39bf725150cea5d50f149e423f6"
          git push origin HEAD:refs/heads/core/materialize-nextid-keycloak-26.8.2
